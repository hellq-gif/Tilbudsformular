name: Prepare transparent machine images

on:
  push:
    branches: [chatgpt-udvikling]
    paths:
      - 'scripts/generate_machine_cutouts.py'
      - '.github/workflows/generate-machine-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-udvikling
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image processing libraries
        run: python -m pip install --quiet pillow numpy opencv-python-headless
      - name: Create PNG files with real transparency
        run: python scripts/generate_machine_cutouts.py
      - name: Commit static images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/swan-transparent.png assets/simonelli1-transparent.png assets/simonelli2-transparent.png assets/jura-transparent.png
          if ! git diff --cached --quiet; then
            git commit -m 'Add transparent product PNGs for offer generator'
            git push origin HEAD:chatgpt-udvikling
          fi
