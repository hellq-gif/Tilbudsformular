<style>
/* Layout: formular til venstre, levende mailudkast til højre; på telefon stables de. */
:root {
  --bg: #F3F0EC;
  --surface: #FFFFFF;
  --ink: #211B17;
  --muted: #6A5E55;
  --line: #DDD5CC;
  --brand: #3A2417;
  --brand-ink: #FFFFFF;
  --accent: #DA6D2B;
  --focus: #B8541A;
  --warn-bg: #FFF1E6;
  --warn-ink: #8A3D0C;
  --ok: #2F6B3A;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17130F; --surface: #221C17; --ink: #F2EBE3; --muted: #B5A79B; --line: #3A3028;
    --brand: #F2EBE3; --brand-ink: #211B17; --focus: #F08A47; --warn-bg: #3A2415; --warn-ink: #F6B98E; --ok: #7CC48A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17130F; --surface: #221C17; --ink: #F2EBE3; --muted: #B5A79B; --line: #3A3028;
  --brand: #F2EBE3; --brand-ink: #211B17; --focus: #F08A47; --warn-bg: #3A2415; --warn-ink: #F6B98E; --ok: #7CC48A;
  color-scheme: dark;
}
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5;
  padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.page { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 16px; min-width: 0; }
.brand img { display: block; height: 36px; width: auto; border-radius: 3px; background: #fff; padding: 2px 4px; }
h1 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -0.01em; }
.grid { display: grid; grid-template-columns: minmax(280px, 380px) minmax(0, 1fr); gap: 32px; align-items: start; }
@media (max-width: 900px) { .grid { grid-template-columns: minmax(0, 1fr); } }
form { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
legend { padding: 0; margin-bottom: 12px; font-size: 12px; font-weight: 650; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
label { font-size: 13px; font-weight: 600; }
label small { font-weight: 400; color: var(--muted); }
input[type="text"], input[type="email"], select, textarea {
  font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px; min-width: 0; width: 100%; box-sizing: border-box;
}
textarea { resize: vertical; min-height: 96px; line-height: 1.5; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.check { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
.side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.bar { display: flex; flex-direction: column; gap: 12px; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.buttons { display: flex; flex-wrap: wrap; gap: 10px; }
button { font: inherit; font-weight: 600; cursor: pointer; border-radius: 6px; padding: 11px 18px; min-height: 44px; border: 1px solid var(--brand); }
button.primary { background: var(--brand); color: var(--brand-ink); }
button.secondary { background: transparent; color: var(--ink); border-color: var(--line); }
button:disabled { opacity: 0.45; cursor: not-allowed; }
.status { margin: 0; font-size: 14px; }
.status.warn { background: var(--warn-bg); color: var(--warn-ink); padding: 10px 12px; border-radius: 6px; }
.status.ok { color: var(--ok); font-weight: 600; }
.status.err { color: var(--warn-ink); }
.previewwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
#preview { min-width: 360px; }
.hint { color: var(--muted); font-size: 13px; margin: 0; }
.blok { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
[hidden] { display: none !important; }
</style>

      <h1>Tilbudsgenerator</h1>
    </div>
    <button type="button" class="secondary" id="reset">Ny kunde (ryd felter)</button>
  </header>

  <div class="grid">
    <form id="form" onsubmit="return false">
      <fieldset>
        <legend>Kunde</legend>
        <div class="field"><label for="firma">Virksomhed</label><input type="text" id="firma" value="Nykredit" autocomplete="off"></div>
        <div class="field"><label for="navn">Kontaktperson <small>(fornavn)</small></label><input type="text" id="navn" value="Celina" autocomplete="off"></div>
      </fieldset>

      <fieldset>
        <legend>Tilbudstype</legend>
        <label class="check"><input type="radio" name="type" id="type-maskine" value="maskine" checked> Kaffemaskine med kaffeaftale</label>
        <label class="check"><input type="radio" name="type" id="type-aftale" value="aftale"> Kun kaffeaftale (uden maskine)</label>
      </fieldset>

      <fieldset id="sek-maskine">
        <legend>Maskine</legend>
        <div class="field"><label for="maskine">Model</label>
          <select id="maskine"><option value="">Vælg model</option><option value="swan">The Swan</option><option value="falcon" selected>The Falcon</option><option value="jura">Jura X10</option></select></div>
        <div class="field"><label for="vand">Vandforsyning</label>
          <select id="vand"><option value="" selected>Vælg</option><option value="tank">Vandtank</option><option value="tank8">8L vandtank</option><option value="fast">Fastvandstilslutning</option></select></div>
        <div class="field"><label for="maelk">Mælk</label>
          <select id="maelk"><option value="">Vælg</option><option value="friskmaelk" selected>Friskmælkskøleskab</option><option value="pulver">Mælkepulver</option><option value="ingen">Ingen mælk</option></select></div>
        <label class="check"><input type="checkbox" id="kakao"> Kakaopulver inkluderet</label>
      </fieldset>

      <fieldset>
        <legend>Kaffe <small style="text-transform:none;letter-spacing:0;font-weight:400">(vælg en eller flere)</small></legend>
        <label class="check"><input type="checkbox" id="kaffe-eb" checked> Early Bird</label>
        <label class="check"><input type="checkbox" id="kaffe-dr" checked> Early Bird Dark Roast</label>
        <label class="check"><input type="checkbox" id="kaffe-bw"> Black Wings</label>
      </fieldset>

      <fieldset>
        <legend>Pris og aftale</legend>
        <div id="maskine-pris" class="blok">
          <div class="row">
            <div class="field"><label for="pris">Koppris <small>(kr.)</small></label><input type="text" id="pris" inputmode="decimal" value="3,50" autocomplete="off"></div>
            <div class="field"><label for="drikkere">Kaffedrikkere <small>(valgfri)</small></label><input type="text" id="drikkere" inputmode="numeric" value="20" autocomplete="off"></div>
          </div>
          <div class="field"><label for="model">Betaling</label>
            <select id="model"><option value="min" selected>Minimumsforbrug pr. måned</option><option value="fast">Fast betaling efter estimeret forbrug</option></select></div>
          <div class="field"><label for="kopper">Kopper pr. måned</label><input type="text" id="kopper" inputmode="numeric" value="100" autocomplete="off"></div>
        </div>
        <div id="aftale-pris" class="blok" hidden>
          <div class="row">
            <div class="field"><label for="kgpris">Pris pr. kg <small>(kr.)</small></label><input type="text" id="kgpris" inputmode="decimal" autocomplete="off"></div>
            <div class="field"><label for="kgmaaned">Kg pr. måned</label><input type="text" id="kgmaaned" inputmode="decimal" autocomplete="off"></div>
          </div>
          <div class="field"><label for="levmin">Min. leveringer pr. år <small>(valgfri)</small></label><input type="text" id="levmin" inputmode="numeric" autocomplete="off"></div>
          <fieldset>
            <legend>Leveres som <small style="text-transform:none;letter-spacing:0;font-weight:400">(vælg en eller flere)</small></legend>
            <label class="check"><input type="checkbox" id="fmt-1kg" checked> Hele bønner i 1 kg poser</label>
            <label class="check"><input type="checkbox" id="fmt-500"> Formalet i 500 g poser <small>(kun Early Bird)</small></label>
            <label class="check"><input type="checkbox" id="fmt-75"> Formalet i 75 g poser <small>(kun Early Bird)</small></label>
          </fieldset>
          <fieldset>
            <legend>Tilbehør <small style="text-transform:none;letter-spacing:0;font-weight:400">(valgfrit)</small></legend>
            <label class="check"><input type="checkbox" id="a-kakao"> Kakaopulver</label>
            <label class="check"><input type="checkbox" id="a-maelk"> Mælkepulver</label>
          </fieldset>
        </div>
        <div class="field"><label for="periode">Aftaleperiode <small>(antal måneder)</small></label><input type="text" id="periode" inputmode="numeric" value="36" autocomplete="off"></div>
        <label class="check"><input type="checkbox" id="ingenper"> Nævn ikke aftaleperiode</label>
      </fieldset>

      <fieldset>
        <legend>Mailen</legend>
        <div class="field"><label for="intro">Indledning</label><textarea id="intro">Tak for en rigtig god snak. Det var en fornøjelse at høre mere om jeres behov. Som lovet har jeg samlet et tilbud, så I kan se, hvad løsningen indeholder.</textarea></div>
        <div class="field"><label for="udloeb">Udløbsdato <small>(valgfri, vises nederst i tilbuddet)</small></label><input type="date" id="udloeb"></div>
        <div class="field"><label for="mail">Svar-adresse <small>(knappen i mailen)</small></label><input type="email" id="mail" value="lb@blackbirdcoffee.dk" autocomplete="off"></div>
      </fieldset>
    </form>

    <div class="side">
      <div class="bar">
        <p class="status" id="status" role="status" aria-live="polite"></p>
        <div class="buttons">
          <button type="button" class="primary" id="copy">Kopiér tilbud</button>
          <button type="button" class="secondary" id="copyhtml">Kopiér HTML-kode</button>
        </div>
        <p class="hint">Sæt tilbuddet ind i en ny mail med Cmd+V. Hvis billederne ikke følger med, så brug HTML-koden i et mailværktøj.</p>
      </div>
      <div class="previewwrap"><div id="preview"></div></div>
    </div>
  </div>
</div>

  { id: "kaffe-dr", name: "Early Bird Dark Roast", img: "dr", scores: [5, 4, 1],
    desc: "Start dagen med vores mørkristede kaffe, der byder på en kraftfuld og fyldig smagsoplevelse med en intens aroma og noter af mørk chokolade, ristede nødder og et strejf af krydderier. Den runde og fyldige profil kommer også fra 100% Arabica bønner som er nøje sammensat i et blandingsforhold fra plantager i Colombia, Guatemala, Brasilien, Kenya, Etiopien og Sumatra." },
  { id: "kaffe-bw", name: "Black Wings", img: "bw", scores: [5, 5, 2],
    desc: "Flyv højt med Black Wings, vores kraftfulde mørkristede 100% Arabica-kaffe fra Syd- og Mellemamerika. Denne dybt aromatiske kaffe har en fyldig, rig krop og intense noter af mørk chokolade. Ideel til at nyde alene eller som base i mælkedrikke som Caffe Latte, hvor dens dybde virkelig skinner igennem." }
];
const kakaoRow = () => `<tr><td style="padding:20px 40px 0 40px;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td style="border-top:1px solid #E6DED3;padding:16px 0 0 0;"><div style="font-family:${SERIF};font-size:18px;line-height:24px;color:#2B1D14;padding-bottom:6px;">Kakaopulver 14 %</div><div style="font-family:${FONT};font-size:14px;line-height:21px;color:#4A3A2E;">Afrundet kakaodrik med god fylde og fin sødme.</div><div style="font-family:${FONT};font-size:12px;line-height:18px;color:#6B5A4A;padding-top:8px;">Lys og sød</div></td></tr></table></td></tr>`;
const beanRow = (name) => {
  const k = KAFFE.find((x) => x.name === name);
  if (!k) return "";
  const [r, f, sy] = k.scores;
  return `<tr><td style="padding:16px 40px 0 40px;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td width="110" valign="top" bgcolor="#FCF6EC" style="background-color:#FCF6EC;padding:8px;"><img src="${IMG[k.img]}" width="94" alt="${esc(k.name)}" style="display:block;border:0;width:94px;height:auto;"></td><td valign="top" style="padding:4px 0 0 20px;"><div style="font-family:${SERIF};font-size:18px;line-height:24px;color:#2B1D14;padding-bottom:6px;">${esc(k.name)}</div><div style="font-family:${FONT};font-size:14px;line-height:21px;color:#4A3A2E;">${esc(k.desc)}</div><div style="font-family:${FONT};font-size:12px;line-height:18px;color:#6B5A4A;padding-top:8px;">Ristning ${r}/5 · Fylde ${f}/5 · Syre ${sy}/5</div></td></tr></table></td></tr>`;
};
const FORMATER = [
  { id: "fmt-1kg", label: "Hele bønner i 1 kg poser" },
  { id: "fmt-500", label: "Formalet i 500 g poser" },
  { id: "fmt-75", label: "Formalet i 75 g poser" }
];
function read() {
  return {
    type: document.querySelector('input[name="type"]:checked').value,
    kgpris: num($("kgpris").value), kgmaaned: num($("kgmaaned").value), levmin: num($("levmin").value),
    akakao: $("a-kakao").checked, amaelk: $("a-maelk").checked,
    formater: FORMATER.filter((f) => $(f.id).checked).map((f) => f.id),
    kaffe: KAFFE.filter((k) => $(k.id).checked).map((k) => k.name),
    firma: $("firma").value.trim(), navn: $("navn").value.trim(), maskine: $("maskine").value,
    vand: $("vand").value, maelk: $("maelk").value, kakao: $("kakao").checked,
    pris: num($("pris").value), drikkere: num($("drikkere").value), model: $("model").value,
    kopper: num($("kopper").value), periode: num($("periode").value), ingenper: $("ingenper").checked,
    intro: $("intro").value.trim(), mail: $("mail").value.trim(), udloeb: $("udloeb").value
  };
}
function missing(s) {
  const m = [];
  if (!s.firma) m.push("virksomhed");
  if (!s.navn) m.push("kontaktperson");
  if (s.type === "aftale") {
    if (!s.kaffe.length) m.push("kaffetype");
    if (s.kgpris === null || s.kgpris <= 0) m.push("pris pr. kg");
    if (s.kgmaaned === null || s.kgmaaned <= 0) m.push("forventet kg pr. måned");
    if (!s.formater.length) m.push("leveringsformat");
    if (s.formater.some((id) => id !== "fmt-1kg") && !s.kaffe.includes("Early Bird")) m.push("Early Bird (formalet fås kun som Early Bird)");
    if (!s.ingenper && (s.periode === null || s.periode <= 0)) m.push("aftaleperiode (eller afkryds, at den ikke skal nævnes)");
    if (!s.mail) m.push("svar-adresse");
    return m;
  }
  if (!s.maskine) m.push("model");
  if (!s.vand) m.push("vandforsyning");
  if (!s.maelk) m.push("mælk");
  if (!s.kaffe.length) m.push("kaffetype");
  if (s.pris === null || s.pris <= 0) m.push("koppris");
  if (s.kopper === null || s.kopper <= 0) m.push("kopper pr. måned");
  if (!s.ingenper && (s.periode === null || s.periode <= 0)) m.push("aftaleperiode (eller afkryds, at den ikke skal nævnes)");
  if (!s.mail) m.push("svar-adresse");
  return m;
}

const h2 = (t, top) => `<tr><td style="padding:${top || 32}px 40px 10px 40px;font-family:${SERIF};font-size:24px;line-height:30px;color:#2B1D14;">${t}</td></tr>`;
const para = (t, pad) => `<tr><td style="padding:${pad || "0 40px 0 40px"};font-family:${FONT};font-size:15px;line-height:24px;color:#4A3A2E;">${t}</td></tr>`;
const bullet = (t) => `<tr><td width="30" valign="top" style="padding:3px 0 8px 0;"><img src="${IMG.bird}" width="18" height="19" alt="" style="display:block;border:0;"></td><td valign="top" style="padding:0 0 8px 0;font-family:${FONT};font-size:15px;line-height:22px;color:#4A3A2E;">${t}</td></tr>`;
const priceLine = (t, last) => `<tr><td style="padding:0 32px ${last ? 28 : 8}px 32px;font-family:${FONT};font-size:14px;line-height:22px;color:#4A3A2E;">${t}</td></tr>`;

function mainAftale(s) {
  const kg = (v) => v.toLocaleString("da-DK", { maximumFractionDigits: 1 });
  const kgM = s.kgmaaned ? kg(s.kgmaaned) : "[antal]";
  const pris = s.kgpris ? fmt2(s.kgpris) : "[Pris]";
  const mdr = s.periode !== null && s.periode > 0 ? Math.round(s.periode) : null;
  const visPeriode = !s.ingenper && mdr;
  const mdrTxt = mdr ? `${mdr} ${mdr === 1 ? "måned" : "måneder"}` : "[antal] måneder";
  const formater = FORMATER.filter((f) => s.formater.includes(f.id));

  const txt = [`Prisen er beregnet ud fra en forventet aftagning på ${kgM} kg pr. måned.`];
  if (s.levmin) txt.push(`Minimumsbestilling: ${Math.round(s.levmin)} ${Math.round(s.levmin) === 1 ? "levering" : "leveringer"} fordelt over et år.`);
  if (!s.ingenper) txt.push(`Aftaleperiode: ${mdrTxt}.`);
  const lines = txt.map((t, i) => priceLine(t, i === txt.length - 1)).join("\n");

  const kaffeTxt = (s.kaffe.includes("Early Bird") ? "Vores favoritbønne er Early Bird, 100 % Arabica. " : "") + "Jeres kaffe: " + (s.kaffe.length ? joinOg(s.kaffe) : "[vælg kaffetype]") + ". I kan frit skifte mellem alle vores kaffevarianter fra levering til levering.";
  const andre = s.kaffe.filter((k) => k !== "Early Bird");
  const mørkNote = andre.length && s.formater.some((id) => id !== "fmt-1kg")
    ? para(`Formalet kaffe fås kun som Early Bird. ${joinOg(andre)} leveres kun som hele bønner i 1 kg poser.`, "4px 40px 0 40px") : "";
  const bullets = formater.map((f) => bullet(esc(f.label))).join("");

  return `${h2("Kaffeaftale", 32)}
${para(`Vi foreslår en løbende kaffeaftale med levering af ca. ${kgM} kg kaffe pr. måned.`)}
${h2("Kaffen")}
${para(kaffeTxt)}
${s.kaffe.map(beanRow).join("")}
${s.akakao ? kakaoRow() : ""}
${s.amaelk ? `<tr><td style="padding:20px 40px 0 40px;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td style="border-top:1px solid #E6DED3;padding:16px 0 0 0;"><div style="font-family:${SERIF};font-size:18px;line-height:24px;color:#2B1D14;padding-bottom:6px;">Mælkepulver</div><div style="font-family:${FONT};font-size:14px;line-height:21px;color:#4A3A2E;">Leveres sammen med kaffen.</div></td></tr></table></td></tr>` : ""}
${h2("Levering")}
${para(`Som udgangspunkt sender vi bønnerne løbende, baseret på det aftalte månedlige forbrugsestimat på ${kgM} kg. Har I for meget eller for lidt på lager, giver I blot besked, så sætter vi forsendelserne på pause eller justerer dem. Dog er I forpligtet til at aftage den forventede mængde.`, "0 40px 12px 40px")}
${para("Kaffen fås som:", "0 40px 10px 40px")}
<tr><td style="padding:0 40px 0 40px;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">${bullets}</table></td></tr>
${mørkNote}
<tr><td style="padding:32px 40px 0 40px;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#F6F1EA" style="background-color:#F6F1EA;">
<tr><td style="padding:28px 32px 6px 32px;font-family:${FONT};font-size:12px;line-height:16px;letter-spacing:1.5px;text-transform:uppercase;color:#6F4529;">Pris</td></tr>
<tr><td style="padding:0 32px 12px 32px;font-family:${SERIF};font-size:40px;line-height:46px;color:#2B1D14;">${pris} kr. <span style="font-size:18px;color:#4A3A2E;">pr. kg</span></td></tr>
${lines}
</table></td></tr>
`;
}

function buildEmail(s) {
  const m = MACH[s.maskine];
  const firma = s.firma || "[Virksomhed]";
  const navn = s.navn || "[Kontaktperson]";
  const vandTxt = s.vand === "tank" ? "Vandtank" : s.vand === "tank8" ? "8 liters vandtank" : s.vand === "fast" ? "Fastvandstilslutning" : "[Vandforsyning]";
  const equip = [];
  if (s.maelk === "friskmaelk") equip.push("Friskmælkskøleskab");
  if (s.maelk === "pulver") equip.push("Mælkepulver");
  equip.push(vandTxt);
  if (s.kakao) equip.push("Kakaopulver");
  const incl = ["maskinleje"];
  if (s.maelk === "friskmaelk") incl.push("køleskab");
  if (s.maelk === "pulver") incl.push("mælkepulver");
  incl.push("kaffe");
  if (s.kakao) incl.push("kakaopulver");
  if (s.vand === "fast") incl.push("fastvandstilslutning");
  incl.push("installation", "fuld serviceaftale", "reservedele", "ombytning ved behov");

  const prisTxt = s.pris ? fmt2(s.pris) : "[Koppris]";
  const kopper = s.kopper ? Math.round(s.kopper).toLocaleString("da-DK") : "[antal]";
  const betaling = s.pris && s.kopper ? fmtKr(s.pris * s.kopper) : "[beløb]";
  const modelLine = s.model === "fast"
    ? `Fast betaling efter et estimeret forbrug på ${kopper} kopper pr. måned, svarende til ${betaling} kr. pr. måned.`
    : `Minimumsforbrug: ${kopper} kopper pr. måned, svarende til en minimumsbetaling på ${betaling} kr. pr. måned.`;
  const mdr = s.periode !== null && s.periode > 0 ? Math.round(s.periode) : null;
  const periodeLine = s.ingenper ? null : mdr ? `Aftaleperiode: ${mdr} ${mdr === 1 ? "måned" : "måneder"}.` : "Aftaleperiode: [antal] måneder.";

  const lines = [priceLine(`Prisen inkluderer ${joinOg(incl)}.`)];
  if (s.drikkere) lines.push(priceLine(`Prisen er beregnet ud fra ${Math.round(s.drikkere)} kaffedrikkere.`));
  if (periodeLine) lines.push(priceLine(modelLine), priceLine(periodeLine, true));
  else lines.push(priceLine(modelLine, true));

  const machineRow = m ? `<tr><td style="padding:24px 40px 0 40px;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#DA6D2B" style="width:100%;max-width:520px;background-color:#DA6D2B;"><tr><td><img src="${IMG[s.maskine]}" width="520" alt="${esc(m.name)}" style="display:block;width:100%;max-width:520px;height:auto;border:0;"></td></tr></table></td></tr>` : "";
  let udloebTxt = "";
  if (s.udloeb) {
    const d = new Date(s.udloeb + "T00:00:00");
    if (!isNaN(d)) udloebTxt = d.toLocaleDateString("da-DK", { day: "numeric", month: "long", year: "numeric" });
  }
  const mailto = "mailto:" + esc(s.mail || "") + "?subject=Svar%20p%C3%A5%20tilbud";

  const mainMaskine = `${machineRow}
${h2("1 × " + esc(m ? m.name : "[Model]"), 32)}
${para(esc(m ? m.desc : "[Vælg model]"))}
<tr><td style="padding:18px 40px 0 40px;font-family:${FONT};font-size:13px;line-height:18px;letter-spacing:1px;text-transform:uppercase;color:#6F4529;">Inkluderet ekstraudstyr</td></tr>
${para(esc(equip.join(" · ")), "4px 40px 0 40px")}
${h2("Kaffen")}
${para((s.kaffe.includes("Early Bird") ? "Vores favoritbønne er Early Bird, 100 % Arabica. " : "") + "Jeres kaffe: " + (s.kaffe.length ? joinOg(s.kaffe) : "[vælg kaffetype]") + ". I kan frit skifte mellem alle vores kaffevarianter fra levering til levering.")}
${s.kaffe.map(beanRow).join("")}
${s.kakao ? kakaoRow() : ""}
${h2("Service og drift", 32)}
<tr><td style="padding:0 40px 0 40px;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">${["Installation", "Løbende levering af kaffe", "Fuld serviceaftale", "Alle reservedele inkluderet", "Ombytning af maskinen ved behov"].map(bullet).join("")}</table></td></tr>
${h2("Intelligent fjernstyring")}
${para("Maskinen registrerer løbende forbrug og lagerstatus, så kaffeleverancerne automatisk bliver tilpasset jeres behov. Vores serviceafdeling kan desuden fjernstyre maskinen, så justeringer af styrke eller temperatur klares over telefonen inden for få minutter, uden behov for et teknikerbesøg.")}
<tr><td style="padding:32px 40px 0 40px;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#F6F1EA" style="background-color:#F6F1EA;">
<tr><td style="padding:28px 32px 6px 32px;font-family:${FONT};font-size:12px;line-height:16px;letter-spacing:1.5px;text-transform:uppercase;color:#6F4529;">Pris</td></tr>
<tr><td style="padding:0 32px 12px 32px;font-family:${SERIF};font-size:40px;line-height:46px;color:#2B1D14;">${prisTxt} kr. <span style="font-size:18px;color:#4A3A2E;">pr. kop</span></td></tr>
${lines.join("\n")}
</table></td></tr>
`;
  const MAIN = s.type === "aftale" ? mainAftale(s) : mainMaskine;

  return `<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#EFEAE3" style="background-color:#EFEAE3;"><tr><td align="center" style="padding:32px 12px;">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" bgcolor="#FFFFFF" style="width:600px;max-width:600px;background-color:#FFFFFF;">
<tr><td style="padding:32px 40px 28px 40px;border-bottom:1px solid #E6DED3;"><img src="${IMG.logo}" width="154" height="50" alt="Blackbird Coffee" style="display:block;border:0;"></td></tr>
<tr><td style="padding:40px 40px 16px 40px;font-family:${FONT};font-size:12px;line-height:16px;letter-spacing:1.5px;text-transform:uppercase;color:#6F4529;">${s.type === "aftale" ? "Kaffeaftale" : "Tilbud"}</td></tr>
<tr><td style="padding:0 40px 20px 40px;font-family:${SERIF};font-size:32px;line-height:38px;color:#2B1D14;">Tilbud til ${esc(firma)}</td></tr>
${para("Hej " + esc(navn) + ",", "0 40px 14px 40px")}
${para(esc(s.intro).replace(/\n/g, "<br>"))}
${MAIN}
${para("Sig endelig til, hvis der er noget, I ønsker tilpasset.", "32px 40px 0 40px")}
<tr><td style="padding:20px 40px 36px 40px;"><table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr><td bgcolor="#3A2417" style="background-color:#3A2417;"><a href="${mailto}" style="display:inline-block;padding:14px 28px;font-family:${FONT};font-size:15px;line-height:20px;color:#FFFFFF;text-decoration:none;">Svar på tilbuddet</a></td></tr></table></td></tr>
<tr><td style="padding:20px 40px 24px 40px;border-top:1px solid #E6DED3;font-family:${FONT};font-size:12px;line-height:19px;color:#6B5A4A;">Alle priser er ekskl. moms. Der er typisk 1–2 ugers leveringstid fra godkendelse.${udloebTxt ? `<br><strong style="color:#2B1D14;">Tilbuddet er gyldigt til ${esc(udloebTxt)}.</strong>` : ""}</td></tr>
</table></td></tr></table>`;
}

let statusTimer = null;
function setStatus(text, kind) {
  const el = $("status");
  el.textContent = text;
  el.className = "status" + (kind ? " " + kind : "");
}
function update() {
  const s = read();
  const a = s.type === "aftale";
  $("sek-maskine").hidden = a;
  $("maskine-pris").hidden = a;
  $("aftale-pris").hidden = !a;
  $("periode").disabled = s.ingenper;
  $("preview").innerHTML = buildEmail(s);
  const miss = missing(s);
  const ready = miss.length === 0;
  $("copy").disabled = !ready;
  $("copyhtml").disabled = !ready;
  if (!ready) setStatus("Mangler stadig: " + miss.join(", ") + ".", "warn");
  else setStatus("Alt er udfyldt. Tilbuddet er klar til at kopiere.", "ok");
}
function flash(text, kind) {
  setStatus(text, kind);
  clearTimeout(statusTimer);
  statusTimer = setTimeout(update, 3500);
}
function fullHtml() {
  return '<!DOCTYPE html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tilbud</title></head><body style="margin:0;padding:0;background-color:#EFEAE3;">' + buildEmail(read()) + "</body></html>";
}
async function copyRich() {
  const html = buildEmail(read());
  const text = $("preview").innerText;
  try {
    if (navigator.clipboard && window.ClipboardItem) {
      await navigator.clipboard.write([new ClipboardItem({
        "text/html": new Blob([html], { type: "text/html" }),
        "text/plain": new Blob([text], { type: "text/plain" })
      })]);
      return true;
    }
  } catch (e) { /* prøv næste metode */ }
  try {
    const r = document.createRange();
    r.selectNodeContents($("preview"));
    const sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(r);
    const ok = document.execCommand("copy");
    sel.removeAllRanges();
    return ok;
  } catch (e) { return false; }
}
async function copyCode() {
  try { await navigator.clipboard.writeText(fullHtml()); return true; } catch (e) { return false; }
}

$("form").addEventListener("input", update);
$("form").addEventListener("change", update);
$("copy").addEventListener("click", async () => {
  if (await copyRich()) flash("Tilbuddet er kopieret. Sæt det ind i en ny mail.", "ok");
  else flash("Kopiering blev afvist her. Markér tilbuddet i udkastet og tryk Cmd+C.", "err");
});
$("copyhtml").addEventListener("click", async () => {
  if (await copyCode()) flash("HTML-koden er kopieret.", "ok");
  else flash("Kopiering blev afvist her. Prøv i stedet Kopiér tilbud.", "err");
});
$("reset").addEventListener("click", () => {
  ["firma", "navn", "pris", "drikkere", "periode"].forEach((id) => { $(id).value = ""; });
  ["maskine", "vand", "maelk"].forEach((id) => { $(id).value = ""; });
  $("kakao").checked = false;
  $("ingenper").checked = false;
  $("udloeb").value = "";
  ["kgpris", "kgmaaned", "levmin"].forEach((id) => { $(id).value = ""; });
  FORMATER.forEach((f) => { $(f.id).checked = f.id === "fmt-1kg"; });
  $("type-maskine").checked = true;
  $("a-kakao").checked = false;
  $("a-maelk").checked = false;
  KAFFE.forEach((k) => { $(k.id).checked = false; });
  $("model").value = "min";
  $("kopper").value = "100";
  update();
  $("firma").focus();
});
update();
</script>
